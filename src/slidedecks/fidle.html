<script>
    window.MathJax = {
        tex: {
            packages: {'[+]': ['color']},
            inlineMath: [['$', '$'], ['\\(', '\\)']]
        },
        loader: {
            load: ['[tex]/color']
        }
    };
</script>

<script src="/mathjax/tex-mml-chtml.js" async>
</script>
<script type="module">
    import Reveal from "reveal.js"
    import "reveal.js/dist/reveal.css"
    import "reveal.js/dist/theme/simple.css"
    import External from "./revealjs_plugins/external"
    import Reveald3 from "./revealjs_plugins/reveald3-vite.js"
    import RevealMenu from "./revealjs_plugins/menu/menu.esm.js"
    import * as RevealMath from "reveal.js/plugin/math/plugin.js";
    import highlight from "./revealjs_plugins/highlight/plugin.js"

    Reveal.initialize({
        showHiddenSlides: false,
        hash: true,
        slideNumber: 'c/t',
        autoPlayMedia: true,
        navigationMode: 'linear',
        plugins: [External, highlight, Reveald3, RevealMenu],//, RevealMath.default.MathJax3],
        viewDistance: 1,
        menu: {
            side: 'left',
            hideMissingTitles: true,
            markers: true,
            numbers: true,
            path: "/revealjs_plugins/menu",
        },
        highlight: {
            hightlightOnLoad: false,
        },
        mathjax3: {
            mathjax: new URL(
                "mathjax/es5/tex-mml-chtml.js",
                import.meta.url
            ).toString(),
            options: {
                menuOptions: {
                    settings: {
                        enrich: false,
                        collapsible: false,
                        speech: false,
                        braille: false,
                        assistiveMml: false,
                    }
                }
            }
        }
    })

    Reveal.on("externalready", async () => {
        console.log("Reveal external ready!")
        Reveal.getPlugin("highlight").init(Reveal);
        if (window.MathJax) {
            await window.MathJax.startup.promise;
            await window.MathJax.typesetPromise();
        }
    });
</script>

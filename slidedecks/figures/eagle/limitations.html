<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../_css/custom.css">
    <link rel="stylesheet" href="../../_css/bootstrap.min.css">

    <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_SVG">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                processEscapes: true
            }
        });
    </script>
    <script src="https://d3js.org/d3.v5.min.js"></script>

</head>
<body>

<div class="container-lg">
    <div class="row">
        <div class="col p-0 m-0">
            <div id="figure"></div>
            <div class="text-danger text-center fw-bold">Not Good</div>
        </div>
        <div class="col p-0 m-0">
            <div id="figure2"></div>
            <div class="text-success text-center fw-bold">Better !</div>
        </div>
    </div>
</div>

<script>


    const margin = {
        top: 10,
        right: 10,
        bottom: 10,
        left: 10,
        width: 270,
        height: 140
    }
    const dt = 0.01;

    const svg = d3.select("#figure")
        .append("svg")
        .attr("viewBox", `0 0 ${margin.width} ${margin.height}`)
        .attr("width", '100%')
        .attr("height", '100%')
        // .style("background-color", "red")
        // .style("border", "1px solid black")
        .attr("preserveAspectRatio", "xMidYMid meet")
        .append("g");

    const svg2 = d3.select("#figure2")
        .append("svg")
        .attr("viewBox", `0 0 ${margin.width} ${margin.height}`)
        .attr("width", '100%')
        .attr("height", '100%')
        // .style("background-color", "red")
        // .style("border", "1px solid black")
        .attr("preserveAspectRatio", "xMidYMid meet")
        .append("g");

    const defs = svg.append("svg:defs");
    const defs2 = svg.append("svg:defs");

    // Arrow head definition
    defs.append("svg:marker")
        .attr("id", "arrowhead")
        .attr("refX", 3)
        .attr("refY", 2)
        .attr("markerWidth", 6)
        .attr("markerHeight", 4)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M 0,0 V 4 L6,2 Z")
        .style("fill", "black")
    defs2.append("svg:marker")
        .attr("id", "arrowhead")
        .attr("refX", 3)
        .attr("refY", 2)
        .attr("markerWidth", 6)
        .attr("markerHeight", 4)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M 0,0 V 4 L6,2 Z")
        .style("fill", "black")


    const ymid = (margin.height - margin.top - margin.bottom) / 2 + margin.top;

    [svg, svg2].forEach(svg => {
        svg.append("line")
            .attr("x1", margin.left)
            .attr("y1", ymid)
            .attr("x2", margin.width - margin.right)
            .attr("y2", ymid)
            .attr("stroke", "black")
            .attr("stroke-width", 1.5)
            .attr("stroke-dasharray", "5,5");

        svg.append("text")
            .attr("x", margin.left)
            .attr("y", ymid + ymid / 2)
            .attr("text-anchor", "start")
            .attr("font-size", "1em")
            .text("Physics:")
            .style("fill", "var(--bs-primary)")
            .attr("alignment-baseline", "middle");

        svg.append("text")
            .attr("x", margin.left)
            .attr("y", ymid - ymid / 2)
            .attr("text-anchor", "start")
            .attr("font-size", "1em")
            .text("Latent:")
            .style("fill", "var(--bs-success)")
            .attr("alignment-baseline", "middle");
    });

    const numSteps = 5
    let xStart = margin.left + 80
    let xEnd = margin.width - margin.right;
    let xStep = (xEnd - xStart) / (numSteps);
    const radius = 10;

    let arrows1 = []
    let arrows2 = []
    let arrows2bis = []
    for (let i = 0; i < numSteps; i++) {
        const xPhy = xStart + i * xStep;
        const yPhy = ymid + ymid / 2;

        const xLat = xStart + (i + 0.5) * xStep;
        const yLat = ymid - ymid / 2;

        [svg, svg2].forEach(svg => {
            svg.append("circle")
                .attr("cx", xPhy)
                .attr("cy", yPhy)
                .attr("r", radius)
                .style("fill", "var(--bs-primary)")

            svg.append("circle")
                .attr("cx", xLat)
                .attr("cy", yLat)
                .attr("r", radius)
                .style("fill", "var(--bs-success)")
        })

        const angle = Math.atan2(yPhy - yLat, xLat - xPhy);

        arrows1.push(svg.append("line")
            .attr("x1", xPhy + radius * Math.cos(angle))
            .attr("y1", yPhy - radius * Math.sin(angle))
            .attr("x2", xLat + radius * Math.cos(angle + Math.PI))
            .attr("y2", yLat - radius * Math.sin(angle + Math.PI))
            .attr("stroke", "black")
            .attr("stroke-width", 1.5)
            .attr("opacity", 0)
            .attr("marker-end", "url(#arrowhead)"));

        if (i === 0) {
            arrows2.push(
                svg2.append("line")
                    .attr("x1", xPhy + radius * Math.cos(angle))
                    .attr("y1", yPhy - radius * Math.sin(angle))
                    .attr("x2", xLat + radius * Math.cos(angle + Math.PI))
                    .attr("y2", yLat - radius * Math.sin(angle + Math.PI))
                    .attr("stroke", "black")
                    .attr("stroke-width", 1.5)
                    .attr("opacity", 0)
                    .attr("marker-end", "url(#arrowhead)"));
        }

        arrows1.push(svg.append("line")
            .attr("x1", xLat - radius * Math.cos(angle + Math.PI))
            .attr("y1", yLat - radius * Math.sin(angle + Math.PI))
            .attr("x2", xPhy - radius * Math.cos(angle) + xStep)
            .attr("y2", yPhy - radius * Math.sin(angle))
            .attr("stroke", "black")
            .attr("stroke-width", 1.5)
            .attr("opacity", 0)
            .attr("marker-end", "url(#arrowhead)"));

        arrows2bis.push(svg2.append("line")
            .attr("x1", xLat - radius * Math.cos(angle + Math.PI))
            .attr("y1", yLat - radius * Math.sin(angle + Math.PI))
            .attr("x2", xPhy - radius * Math.cos(angle) + xStep)
            .attr("y2", yPhy - radius * Math.sin(angle))
            .attr("stroke", "black")
            .attr("stroke-width", 1.5)
            .attr("opacity", 0)
            .attr("marker-end", "url(#arrowhead)"));

        arrows2.push(svg2.append("line")
            .attr("x1", xLat + radius)
            .attr("y1", yLat)
            .attr("x2", xLat + xStep - radius)
            .attr("y2", yLat)
            .attr("stroke", "black")
            .attr("stroke-width", 1.5)
            .attr("opacity", 0)
            .attr("marker-end", "url(#arrowhead)"))
        ;
    }

    // Merge arrows1 and arrows2
    arrows2bis.forEach(d => {
        arrows2.push(d);
    })

    function updateArrow1(i) {
        if (i > arrows1.length - 1) {
            d3.timeout(() => {
                for (let j = 0; j < arrows1.length; j++) {
                    arrows1[j].attr("opacity", 0);
                }
                updateArrow1(0)
            }, 1000)
            return;
        }
        arrows1[i]
            .transition()
            .duration(300)
            .attr("opacity", 1)
            .on("end", function () {
                updateArrow1(i + 1)
            });
    }

    function updateArrow2(i) {
        if (i > arrows2.length - 1) {
            d3.timeout(() => {
                for (let j = 0; j < arrows2.length; j++) {
                    arrows2[j].attr("opacity", 0);
                }
                updateArrow2(0)
            }, 2000)
            return;
        }
        arrows2[i]
            .transition()
            .duration(300)
            .attr("opacity", 1)
            .on("end", function () {
                updateArrow2(i + 1)
            });
    }

    updateArrow1(0)
    d3.timeout(() => {
        updateArrow2(0)
    }, 2000);


</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../_css/custom.css">
    <link rel="stylesheet" href="../../_css/bootstrap.min.css">

    <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_SVG">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                processEscapes: true
            }
        });
    </script>
    <style>
        .equation-term {
            overflow: hidden;
            opacity: 1;
            max-width: 1000px; /* enough to show full content */
            transform: translateX(30px);
            transition: all 0.5s ease;
            white-space: nowrap;
        }

        .equation-term.visible {
            opacity: 1;
            max-width: 1000px; /* enough to show full content */
            transform: translateX(0);
        }

        .equation-wrapper {
            display: flex;
            justify-content: center;
            align-items: end;
            /*flex-wrap: nowrap;*/
            flex-direction: row;
            gap: 1rem;
            transition: all 0.5s ease;
        }


    </style>
</head>
<body>


<div class="container-lg">
    <div class="row align-content-center">
        <div class="col">
            <div class="equation-wrapper">
                <div>
                    <div class="d-flex flex-row align-items-center">
                        <img src="../../assets/continuous_pde/sota/interpolation.jpg" alt="Interpolation"
                             class="img-fluid m-3 border" style="width:50px">
                        =
                    </div>
                    <div class="text-center fw-bold">Target</div>
                </div>

                <!-- PDE Loss -->
                <div id="pinn_pde_loss" class="equation-term visible">
                    <div>
                        $\Biggl\|$ <span class="text-primary">$\dot s_\theta$</span>$ - f($<span class="text-primary">$s_\theta$</span>$)$
                        $\Biggl\|$
                    </div>
                    <div class="text-center fw-bold">PDE Residual</div>
                </div>


                <!-- IC Loss -->
                <div id="pinn_ic_loss" class="equation-term">
                    <div>
                        $+\Biggl\|$ <span class="text-primary">$s_\theta(x, 0)$</span>$ - s(x, 0) $ $\Biggl\|$
                    </div>
                    <div class="text-center fw-bold">Initial Condition</div>
                </div>

                <!-- Data Loss -->
                <div id="pinn_data_loss" class="equation-term ">
                    <div>
                        $+\Biggl\|$
                        <span class="text-primary">$s_\theta(x, t) -  $</span>
                        <img src="../../assets/continuous_pde/sota/initial.jpg" alt="Initial"
                             class="img-fluid m-3 border" style="width:100px">
                        $\Biggl\|$
                    </div>
                    <div class="text-center fw-bold">Sparse obs. points</div>
                </div>

            </div>
        </div>
        <div class="col-2 align-content-around">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="dataLossToggle">
                <label class="form-check-label" for="dataLossToggle">Data term</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="pdeLossToggle" checked>
                <label class="form-check-label" for="pdeLossToggle">PDE term</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="icLossToggle">
                <label class="form-check-label" for="icLossToggle">I.C. term</label>
            </div>
        </div>
    </div>

</div>


<!-- Switches -->
<div class="mb-4 d-flex gap-3">

</div>
<script>
    const terms = {
        dataLossToggle: 'pinn_data_loss',
        pdeLossToggle: 'pinn_pde_loss',
        icLossToggle: 'pinn_ic_loss'
    };

    const content = {
        pinn_data_loss: document.getElementById('pinn_data_loss').innerHTML,
        pinn_pde_loss: document.getElementById('pinn_pde_loss').innerHTML,
        pinn_ic_loss: document.getElementById('pinn_ic_loss').innerHTML,
    }

    Object.keys(terms).forEach(toggleId => {
        const checkbox = document.getElementById(toggleId);
        const term = document.getElementById(terms[toggleId]);

        checkbox.addEventListener('change', () => {
            term.classList.toggle('visible', checkbox.checked);
            // Re-typeset math if needed
            if (typeof MathJax !== 'undefined') {
                MathJax.Hub.Queue(["Typeset", MathJax.Hub]);
            }
        });

    });
</script>
</body>
</html>

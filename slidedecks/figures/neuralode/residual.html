<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimized Animation</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
        body {
            margin: 0;
        }

        svg {
            display: block;
            margin: auto;
        }

        .MathJax_SVG_Display {
            margin: 0 ! important
        }

    </style>
    <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_SVG">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                processEscapes: true
            }
        });
    </script>

</head>
<body>

<script>
    const width = 1000, height = 650;

    const margin = {top: 10, right: 50, bottom: 10, left: 50};
    const xScale = d3.scaleLinear().domain([0, 1]).range([margin.left, width - margin.right]);
    const yScale = d3.scaleLinear().domain([0, 1]).range([height - margin.bottom, margin.top]);

    const svg = d3.select("body").append("svg")
        .attr("viewBox", [0, 0, width, height]);

    const n_layers = 5
    const layer_width = 1 / (n_layers - 1);

    // Add arrow head marker
    const arrow_size = 12;
    const marker = svg.append("defs").append("marker")
        .attr("id", "arrowhead")
        .attr("markerWidth", arrow_size)
        .attr("markerHeight", arrow_size)
        .attr("refX", arrow_size)
        .attr("refY", arrow_size / 2)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M 0,0 L " + arrow_size + "," + (arrow_size / 2) + " L 0," + arrow_size + " Z")
        .attr("fill", "#4E5458");

    // .attr("stroke-width", 4);

    function createBlock(layer_id) {

        // A block is composed of a rectangle at layer position +0.33, and a (+) sign at +0.66
        const height = (yScale(0) - yScale(1)) * (1 - 0.2 * layer_id);
        const width = xScale(layer_width / 3) - xScale(0);
        const group = svg.append("g").attr("id", `block_${layer_id}`);
        const rect_x = xScale((layer_id + 0.33) * layer_width);


        const n_neurons = 2 ** (n_layers - layer_id - 1);
        group.selectAll(".neuron.layer-" + layer_id)
            .data(d3.range(n_neurons).map(i => ({
                layer: layer_id,
                index: i,
                activation: Math.random()
            })))
            .enter()
            .append("circle")
            .attr("class", "neuron layer-" + layer_id)
            .attr("cx", rect_x)
            .attr("cy", d => yScale((d.index + 1) / (n_neurons + 1)))
            .attr("r", 0.025 * (xScale(1) - xScale(0)))
            .attr("stroke", "white")
            .attr("stroke-width", 3);

        const rect_height = yScale(1 / (n_neurons + 1)) - yScale(1);
        group.append("rect")
            .attr("x", rect_x - width / 2)
            .attr("y", yScale(0.5) - rect_height / 2)
            .attr("width", width)
            .attr("height", rect_height)
            .attr("fill", "none")
            .attr("rx", 25)
            .attr("stroke", "#000000")
            .attr("opacity", 0.7)
            .attr("stroke-width", 1);

        const radius = Math.min(width, height) / 3;
        const circle_x = xScale((layer_id + 0.75) * layer_width);
        group.append("circle")
            .attr("cx", circle_x)
            .attr("cy", yScale(0.5))
            .attr("r", radius)
            .attr("fill", "#FFFFFF")
            .attr("stroke", "#000000")
            .attr("stroke-width", 1);

        group.append("text")
            .attr("x", circle_x)
            .attr("y", yScale(0.5))
            .attr("font-size", Math.min(width, height) / 2)
            .attr("fill", "#000000")
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .text("+");

        // Arrow from previous layer to block
        group.append("line")
            .attr("class", "input_arrow arrow")
            .attr("id", `input_arrow_${layer_id}`)
            .attr("x1", xScale((layer_id - 1 + 0.75) * layer_width) + radius)
            .attr("y1", yScale(0.5))
            .attr("x2", xScale((layer_id * layer_width)) + width / 2)
            .attr("y2", yScale(0.5))
            .attr("stroke", "#000000")
            .attr("stroke-width", 2)
            .attr("opacity", 0.0)
            .attr("marker-end", "url(#arrowhead)");

        // Arrow from block to next layer
        group.append("line")
            .attr("class", "output_arrow arrow")
            .attr("id", `output_arrow_${layer_id}`)
            .attr("x1", rect_x + width / 2)
            .attr("y1", yScale(0.5))
            .attr("x2", circle_x - radius)
            .attr("y2", yScale(0.5))
            .attr("stroke", "#000000")
            .attr("stroke-width", 2)
            .attr("opacity", 0.0)
            .attr("marker-end", "url(#arrowhead)");

        // // Curved arrow from the beginning of the block to the (+) sign
        const curve_start_x = xScale(layer_id * layer_width)
        const curve_end_x = circle_x;
        const curve_y = yScale(0.5) - height / 2;

        const curve_path = d3.path();
        curve_path.moveTo(curve_start_x, yScale(0.5));
        curve_path.quadraticCurveTo((curve_start_x + curve_end_x) / 2, curve_y, curve_end_x, yScale(0.5) - radius);
        group.append("path")
            .attr("class", "curve_arrow arrow")
            .attr("id", `curve_${layer_id}`)
            .attr("d", curve_path.toString())
            .attr("fill", "none")
            .attr("stroke", "#000000")
            .attr("stroke-width", 2)
            .attr("opacity", 0.0)
            .attr("marker-end", "url(#arrowhead)");
    }

    for (let i = 0; i < n_layers - 1; i++) {
        createBlock(i);
    }

    let lastTime = 0;
    const fps = 10;                // target FPS
    const frameDuration = 1000 / fps;

    const activationColor = d3.scaleSequential(d3.interpolateGnBu)
        .domain([0, 1]);

    function animateNeurons(timestamp) {
        if (timestamp - lastTime >= frameDuration) {
            lastTime = timestamp;
            svg.selectAll(".neuron")
                .each(function (d) {
                    d.activation += 0.2 * (Math.random() - 0.5);
                    d.activation = Math.max(0, Math.min(1, d.activation));
                })
                .attr("fill", d => activationColor(d.activation));
        }
        requestAnimationFrame(animateNeurons);
    }


    requestAnimationFrame(animateNeurons);

    let current_layer= 0;

    function updateArrow(){
        if (current_layer >= n_layers -1){
            current_layer =0;
            svg.selectAll(".arrow")
                .transition()
                .delay(350)
                .attr("opacity", 0.0);
            return;
        }

        // Select input arrow, output arrow, and curve arrow of the current layer
        const inputArrow = svg.selectAll(`#input_arrow_${current_layer}`);
        const outputArrow = svg.selectAll(`#output_arrow_${current_layer}`);
        const curveArrow = svg.selectAll(`#curve_${current_layer}`);

        // Set their opacity to 1 (visible)
        inputArrow.transition()
            .delay(200)
            .attr("opacity", 1.0);

        outputArrow.transition()
            .delay(400)
            .attr("opacity", 1.0);
        curveArrow.transition()
            .delay(600)
            .attr("opacity", 1.0);
        current_layer += 1;
    }

    setInterval(updateArrow, 1000);




</script>
</body>
</html>

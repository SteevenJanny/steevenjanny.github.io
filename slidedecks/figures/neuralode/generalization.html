<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimized Animation</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
        body {
            margin: 0;
        }

        svg {
            display: block;
            margin: auto;
        }

        .MathJax_SVG_Display {
            margin: 0 ! important
        }

    </style>
    <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_SVG">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                processEscapes: true
            }
        });
    </script>

</head>
<body>

<script>
    const width = 1000, height = 650;

    const margin = {top: 50, right: 10, bottom: 10, left: 10};
    const xScale = d3.scaleLinear().domain([0, 1]).range([margin.left, width - margin.right]);
    const yScale = d3.scaleLinear().domain([1, 0]).range([height - margin.bottom, margin.top]);

    const svg = d3.select("body").append("svg")
        // .style("border", "1px solid red")
        .attr("viewBox", [0, 0, width, height]);


    const images = [
        "../../assets/continuous_pde/videos/initial_condition_0.png",
        "../../assets/continuous_pde/videos/initial_condition_1.png",
        "../../assets/continuous_pde/videos/initial_condition_2.png"
    ]

    const videos = [
        "../../assets/continuous_pde/videos/trajectory_0.mp4",
        "../../assets/continuous_pde/videos/trajectory_1.mp4",
        "../../assets/continuous_pde/videos/trajectory_2.mp4"
    ]

    // Add arrow head marker
    const arrow_size = 12;
    const defs = svg.append("defs");
    defs.append("marker")
        .attr("id", "arrowhead")
        .attr("markerWidth", arrow_size)
        .attr("markerHeight", arrow_size)
        .attr("refX", arrow_size)
        .attr("refY", arrow_size / 2)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M 0,0 L " + arrow_size + "," + (arrow_size / 2) + " L 0," + arrow_size + " Z")
        .attr("fill", "#4E5458");

    // Image border radius
    defs.append("clipPath")
        .attr("id", "imageClip")
        .append("rect")
        .attr("x", "25%")
        .attr("y", "25%")
        .attr("width", "50%")
        .attr("height", "50%")
        .attr("rx", 15)
        .attr("ry", 15);

    const nCols = 3
    const nImages = 3
    const colWidth = (width - margin.left - margin.right) / nCols
    const rowHeight = (height - margin.top - margin.bottom) / nImages;
    const config = {
        gapY: 40,
        gapX: 0.1
    }
    const x0 = margin.left;
    const y0 = margin.top;

    // Add column names
    svg.append("foreignObject")
        .attr("x", x0 + colWidth / 2 - 50)
        .attr("y", y0 - 40)
        .attr("width", 150)
        .attr("height", 80)
        .append("xhtml:div")
        .style("width", "100px")
        .style("height", "50px")
        .style("display", "flex")
        .style("justify-content", "center")
        .style("align-items", "center")
        .style("font-size", "3rem")
        .style("color", "#4E5458")
        .text("$$\\mathbf{s}_0(x)$$");

    // Add column names
    svg.append("foreignObject")
        .attr("x", x0 + 5*colWidth / 2 - 50)
        .attr("y", y0 - 40)
        .attr("width", 150)
        .attr("height", 80)
        .append("xhtml:div")
        .style("width", "100px")
        .style("height", "50px")
        .style("display", "flex")
        .style("justify-content", "center")
        .style("align-items", "center")
        .style("font-size", "3rem")
        .style("color", "#4E5458")
        .text("$$\\mathbf{s}(t, x)$$");

    // Insert image
    const imgSize = Math.min(colWidth - config.gapX, rowHeight - config.gapY);
    images.forEach((imgSrc, i) => {
        const group = svg.append("g")
            .attr("transform", "translate(" + (x0 + colWidth / 2) + "," + (y0 + (2 * i + 1) * rowHeight / 2) + ")");
        group.append("image")
            .attr("href", imgSrc)
            .attr("width", imgSize)
            .attr("height", imgSize)
            .attr("x", -imgSize / 2)
            .attr("y", -imgSize / 2)
            .attr("opacity", 0.5)
            .attr("clip-path", "inset(0 round 15px)");

    });

    const block = svg.append("g")
        .attr("transform", "translate(" + (x0 + 1.5 * colWidth) + "," + (y0 + (height - margin.top - margin.bottom) / 2) + ")")

    // Central block model
    const rectWidth = 250;
    const rectHeight = 100;
    block.append("rect")
        .attr("x", -rectWidth / 2)
        .attr("y", -rectHeight / 2)
        .attr("width", rectWidth)
        .attr("height", rectHeight)
        .attr("fill", "#D5EFDA")
        .attr("rx", 15)
        .attr("ry", 15);

    // Text in the block
    block.append("foreignObject")
        .attr("x", -rectWidth / 2)
        .attr("y", -rectHeight / 2)
        .attr("width", rectWidth)
        .attr("height", rectHeight)
        .append("xhtml:div")
        .style("width", rectWidth + "px")
        .style("height", rectHeight + "px")
        .style("display", "flex")
        .style("justify-content", "center")
        .style("align-items", "center")
        .style("font-size", "3rem")
        .style("color", "#4E5458")
        .text("$$ \\dot{\\mathbf{s}} = f_\\theta(\\mathbf{s})$$");


    // Insert video
    videos.forEach((videoSrc, i) => {
        const group = svg.append("g")
            .attr("transform", "translate(" + (x0 + 2.5 * colWidth) + "," + (y0 + (2 * i + 1) * rowHeight / 2) + ")");
        group.append("foreignObject")
            .attr("width", imgSize)
            .attr("height", imgSize)
            .attr("x", -imgSize / 2)
            .attr("y", -imgSize / 2)
            .append("xhtml:video")
            .attr("src", videoSrc)
            .attr("width", imgSize)
            .attr("height", imgSize)
            .attr("loop", true)
            .attr("muted", true)
            .attr("autoplay", true)
            .attr("playsinline", true)
            .style("border-radius", "15px");
    });

    // Arrows
    const shift = 10
    const arrowData = [
        {
            x1: x0 + colWidth / 2 + imgSize / 2,
            y1: y0 + rowHeight / 2,
            x2: x0 + 1.5 * colWidth - rectWidth / 2,
            y2: y0 + 3 * rowHeight / 2 - shift
        },
        {
            x1: x0 + colWidth / 2 + imgSize / 2,
            y1: y0 + 3 * rowHeight / 2,
            x2: x0 + 1.5 * colWidth - rectWidth / 2,
            y2: y0 + 3 * rowHeight / 2
        },
        {
            x1: x0 + colWidth / 2 + imgSize / 2,
            y1: y0 + 5 * rowHeight / 2,
            x2: x0 + 1.5 * colWidth - rectWidth / 2,
            y2: y0 + 3 * rowHeight / 2 + shift
        },
        {
            x1: x0 + 1.5 * colWidth + rectWidth / 2,
            y1: y0 + 3 * rowHeight / 2 - shift,
            x2: x0 + 2.5 * colWidth - imgSize / 2,
            y2: y0 + rowHeight / 2
        },
        {
            x1: x0 + 1.5 * colWidth + rectWidth / 2,
            y1: y0 + 3 * rowHeight / 2,
            x2: x0 + 2.5 * colWidth - imgSize / 2,
            y2: y0 + 3 * rowHeight / 2
        },
        {
            x1: x0 + 1.5 * colWidth + rectWidth / 2,
            y1: y0 + 3 * rowHeight / 2 + shift,
            x2: x0 + 2.5 * colWidth - imgSize / 2,
            y2: y0 + 5 * rowHeight / 2
        },
    ];

    svg.selectAll("line.arrow")
        .data(arrowData)
        .enter()
        .append("line")
        .attr("class", "arrow")
        .attr("x1", d => d.x1)
        .attr("y1", d => d.y1)
        .attr("x2", d => d.x2)
        .attr('y2', d => d.y2)
        .attr("stroke", "#4E5458")
        .attr("stroke-width", 2)
        .attr("marker-end", "url(#arrowhead)");


</script>
</body>
</html>

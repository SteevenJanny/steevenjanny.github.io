<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimized Animation</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <style>
        body {
            margin: 0;
        }

        svg {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>

<script>
    const width = 1000, height = 375, N_points = 25, dt = 0.01, T = 75;
    const graph_margin = {top: 10, right: 10, bottom: 10, left: 10};
    const xScale = d3.scaleLinear().domain([-4, 4]).range([graph_margin.left, width - graph_margin.right]);
    const yScale = d3.scaleLinear().domain([-4, 4]).range([height - graph_margin.bottom, graph_margin.top]);

    const svg = d3.select("body").append("svg")
        .attr("viewBox", [0, 0, width, height]);

    // Axes
    svg.append("g").attr("transform", `translate(0,${height / 2 - graph_margin.top})`).call(d3.axisBottom(xScale));
    svg.append("g").attr("transform", `translate(${width / 2},0)`).call(d3.axisLeft(yScale));

    // Grid
    const grid = (axis, ticks, size) => axis.tickSize(-size).tickFormat("").ticks(ticks);
    svg.append("g").attr("transform", `translate(0,${height - graph_margin.top})`)
        .call(grid(d3.axisBottom(xScale), N_points, height - graph_margin.top - graph_margin.bottom))
        .style("color", "#CECECE").call(g => g.select(".domain").remove());
    svg.append("g").attr("transform", `translate(${graph_margin.left},0)`)
        .call(grid(d3.axisLeft(yScale), N_points, width - graph_margin.left - graph_margin.right))
        .style("color", "#CECECE").call(g => g.select(".domain").remove());

    // Labels
    svg.append("text").attr("x", width - 10).attr("y", height / 2 - 20)
        .attr("text-anchor", "end").style("font-size", "20px").text("position");
    svg.append("text").attr("x", width / 2 + 20).attr("y", 30)
        .attr("text-anchor", "start").style("font-size", "20px").text("velocity");

    // Vector field precomputation
    const f = state => ({x: state.y, y: -state.x + (1 - state.x * state.x) * state.y});

    const createParticle = () => ({
        x: 8 * Math.random() - 4,
        y: 8 * Math.random() - 4,
        t: Math.random() * T,
        color: d3.interpolateRainbow(Math.random())
    });

    let particleData = []
    let particleSet = svg.append("g")

    const drawParticles = N_particles => {
        while (particleData.length < N_particles) {
            const p = createParticle();
            particleData.push(p);
        }
        while (particleData.length > N_particles) {
            particleData.pop();
        }
        particleSet.selectAll("circle")
            .remove();
        particleSet.selectAll("circle")
            .data(particleData)
            .enter()
            .append("circle")
            .attr("r", 4)
            .attr("stroke", "black")
            .attr("stroke-width", 0.5)
            .attr("fill", d => d.color)
            .attr("cx", d => xScale(d.x))
            .attr("cy", d => yScale(d.y))
            .style("opacity", d => 1 - d.t / T)

    };
    drawParticles(100);

    let lastTime = 0
    d3.timer((elapsed) => {
        const deltaMs = elapsed - lastTime;
        lastTime = elapsed;

        // Calculate scaled dt: seconds per frame (deltaMs in ms)
        const dt_scaled = deltaMs / 1000; // e.g. 16ms → 0.016 seconds

        // Now scale your physics update
        particleData.forEach(p => {
            const d = f(p);
            p.x += d.x * dt_scaled;
            p.y += d.y * dt_scaled;
            p.t += 1; // time-based, too!

            if (p.t > T) {
                Object.assign(p, createParticle());
            }
        });

        particleSet.selectAll("circle")
            .data(particleData)
            .attr("cx", d => xScale(d.x))
            .attr("cy", d => yScale(d.y))
            .style("opacity", d => 1 - d.t / T);
    });


    var _transitions = [
        {
            transitionForward: () => drawParticles(1000),
            transitionBackward: () => drawParticles(100),
            index: 1
        },
    ]


</script>
</body>
</html>
